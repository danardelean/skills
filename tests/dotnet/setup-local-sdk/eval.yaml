name: setup-local-sdk
description: Evaluates the dotnet/setup-local-sdk skill
type: capability
defaults:
  timeout: 10m
stimuli:
  - name: Detect incompatible .NET host version
    prompt: I already ran dotnet --version and it printed 9.0.306. I want to set up a local .NET 11 preview SDK for my project using the global.json SDK paths feature. Is that possible?
    tags:
      capability: host-version-gate
      risk: wasted-download
      journey: try-prerelease
    constraints:
      reject_tools:
        - bash
        - powershell
        - web_fetch
    graders:
      - type: output-contains
        config:
          substring: 9.0.306
      - type: output-matches
        config:
          pattern: '(\.NET 10\+|\.NET 10 or later|10 or higher|10 or later|requires.{0,40}10|version 10)'
      - type: output-matches
        config:
          pattern: '("paths"|global\.json.{0,80}paths|paths.{0,80}global\.json)'
      - type: output-matches
        config:
          pattern: '(install|upgrade).{0,80}(\.NET 10|10)'
      - type: output-not-matches
        config:
          pattern: '(--install-dir|Let me download|Downloading and installing|dotnet-install\.(sh|ps1))'
      - type: prompt
    rubric:
      - The agent detected that version 9.0.306 is below the .NET 10 requirement
      - The agent explained that .NET 10+ is required for the paths feature
      - The agent told the user to install .NET 10+ system-wide first
      - The agent did not proceed with local SDK installation commands before the host SDK prerequisite was met

  - name: Create team install scripts
    prompt: This repo already has a global.json for a .NET 11 preview. Create install scripts and repo configuration, including a clear missing-SDK message, so teammates can reproduce the project-local SDK setup on any OS after cloning. Preserve the existing global.json sections. Don't download the SDK now.
    tags:
      capability: team-install-scripts
      risk: lost-global-json-settings
      journey: team-setup
    environment:
      files:
        - src: ./fixtures/create-team-install-scripts/global.json
          dest: global.json
    graders:
      - type: file-exists
        config:
          path: install*.sh
      - type: file-exists
        config:
          path: install*.ps1
      - type: output-matches
        config:
          pattern: 'install[^\s]*\.sh'
      - type: output-matches
        config:
          pattern: 'install[^\s]*\.ps1'
      - type: file-contains
        config:
          path: global.json
          value: paths
      - type: file-contains
        config:
          path: global.json
          value: version
      - type: file-contains
        config:
          path: global.json
          value: msbuild-sdks
      - type: file-contains
        config:
          path: global.json
          value: tools
      - type: file-contains
        config:
          path: global.json
          value: errorMessage
      - type: file-contains
        config:
          path: global.json
          value: 11.0.100-preview.3.26207.106
      - type: file-contains
        config:
          path: global.json
          value: Example.Sdk
      - type: file-contains
        config:
          path: global.json
          value: 1.2.3
      - type: file-contains
        config:
          path: global.json
          value: dotnet-example
      - type: file-contains
        config:
          path: global.json
          value: 4.5.6
      - type: output-matches
        config:
          pattern: '(merge|preserve|backup|back up|existing)'
      - type: output-matches
        config:
          pattern: '(teammates|team|clone|after cloning)'
      - type: file-not-contains
        config:
          path: install*.sh
          value: export PATH
      - type: file-not-contains
        config:
          path: install*.ps1
          value: $env:PATH
      - type: prompt
    rubric:
      - The agent created cross-platform scripts that teammates can run after cloning
      - The agent configured missing-SDK guidance that points teammates to the install scripts
      - The agent avoided dropping existing global.json settings
      - The agent made the setup reproducible without requiring teammates to change PATH

  - name: Plan a project-local .NET 11 preview setup without downloading
    prompt: I want to try the latest .NET 11 preview in my project without affecting my global install. Show me the exact commands and configuration you would use to set it up locally, but do not download or install anything now.
    tags:
      capability: plan-local-sdk-setup
      risk: system-install-change
      journey: try-prerelease
    constraints:
      reject_tools:
        - bash
        - powershell
        - web_fetch
    graders:
      - type: output-contains
        config:
          substring: dotnet-install
      - type: output-contains
        config:
          substring: global.json
      - type: output-contains
        config:
          substring: .dotnet
      - type: output-matches
        config:
          pattern: '("paths"|global\.json.{0,80}paths|paths.{0,80}global\.json)'
      - type: output-matches
        config:
          pattern: '(\.gitignore|gitignore|source control|committed|commit)'
      - type: output-not-matches
        config:
          pattern: '(export\s+PATH|setx\s+PATH|\$env:PATH\s*=|set\s+PATH=)'
      - type: prompt
    rubric:
      - The agent described a project-local SDK setup that does not change the system-wide installation
      - The agent configured SDK resolution (global.json paths) so the local SDK is preferred with the host install as fallback
      - The agent excluded the local SDK directory from source control
      - The agent explained how to clean up
      - The agent presented the plan/commands without actually downloading or installing the SDK

  - name: Choose the channel for a release candidate daily build
    prompt: I need the .NET 11 RC 2 bits before RC 2 ships, as a project-local SDK in my repo. Which channel and quality do I give dotnet-install, and how can I check which build that channel currently has without downloading it?
    tags:
      capability: choose-daily-channel
      risk: wrong-lane-installed
      journey: try-prerelease
    constraints:
      reject_tools:
        - bash
        - powershell
        - web_fetch
    graders:
      - type: output-matches
        config:
          pattern: '11\.0\.1xx-rc2'
      - type: output-matches
        config:
          pattern: '(--quality\s+daily|-Quality\s+daily|quality.{0,20}daily)'
      - type: output-matches
        config:
          pattern: '(aka\.ms/dotnet|dotnet-install[\s\S]{0,160}(--dry-run|-DryRun))'
      - type: output-matches
        config:
          pattern: '(--dry-run|-DryRun|dry run|HEAD|redirect|url_effective|Location header)'
      - type: output-not-matches
        config:
          pattern: '(dotnet-install: (Downloading|Extracting)|Installation finished successfully|Downloaded file size)'
      - type: prompt
    rubric:
      - The agent named a channel that identifies the RC 2 lane rather than the generic 11.0 channel, which resolves to the newest released preview
      - The agent explained how to learn the build a daily channel currently serves without downloading it
      - The agent did not download or install anything

  - name: Diagnose a workload install failure on a daily SDK
    prompt: 'I installed a daily .NET 11 SDK into ./.dotnet in my repo and ran ./.dotnet/dotnet workload install maui. It printed "No workload update found" and then failed with: Version 10.0.13 of package microsoft.netcore.app.runtime.aot.osx-arm64.cross.iossimulator-x64 is not found in NuGet feeds https://api.nuget.org/v3/index.json. What is wrong and what do I do?'
    tags:
      capability: diagnose-daily-workload-failure
      risk: stuck-or-wrong-bits
      journey: try-prerelease
    constraints:
      reject_tools:
        - bash
        - powershell
        - web_fetch
    graders:
      - type: output-matches
        config:
          pattern: '(servicing|Patch Tuesday|not (yet )?(public|published|released|on nuget))'
      - type: output-matches
        config:
          pattern: '(NuGet\.config|dotnet11|pkgs\.dev\.azure\.com|package source|feed)'
      - type: output-matches
        config:
          pattern: '(update-mode|workload set|manifests)'
      - type: output-not-matches
        config:
          pattern: '(install(ed|ation) (succeeded|successful|completed)|is now installed)'
      - type: prompt
    rubric:
      - The agent explained that the missing 10.0.13 package is the previous major's servicing runtime that is not yet publicly available
      - The agent explained that nuget.org has no manifests for a daily band and that the installer fell back to the manifests bundled with the SDK
      - The agent gave a concrete way forward, such as configuring the daily feeds and the manifests update mode, waiting for the runtime to be published, or pointing the compat manifests at a public version
      - The agent did not claim the workload was installed

  - name: Detect workloads installed from an older band
    prompt: 'On a 12.0.1xx daily SDK installed in ./.dotnet, ./.dotnet/dotnet workload install ios android said "Successfully installed workload(s) ios android", but workload list shows ios 26.5.12193-net11-rc.1/11.0.100-rc.1 and android 37.0.0-rc.1.2257/11.0.100-rc.1. I expected the .NET 12 builds with Xcode 27 support. Is this right?'
    tags:
      capability: verify-workload-band
      risk: silent-wrong-bits
      journey: try-prerelease
    constraints:
      reject_tools:
        - bash
        - powershell
        - web_fetch
    graders:
      - type: output-matches
        config:
          pattern: '(not right|not correct|is wrong|older band|fell back|fallback|bundled)'
      - type: output-matches
        config:
          pattern: 'dotnet12'
      - type: output-matches
        config:
          pattern: '(update-mode|workload set|manifests)'
      - type: output-matches
        config:
          pattern: '(12\.0\.100|net12|same[^\n]{0,20}band|(band|manifest)s?[^\n]{0,60}(match|equal|align)[^\n]{0,40}SDK)'
      - type: prompt
    rubric:
      - The agent recognized that the installed manifests belong to an older band than the SDK and that the result is not what the user wanted
      - The agent explained that the installer fell back to the manifests bundled with the SDK because the daily band's manifests were not reachable
      - The agent gave the feed and installer configuration needed to get the .NET 12 band
      - The agent told the user to verify the band in workload list after reinstalling

  - name: Create team install scripts for a daily SDK with workloads
    prompt: >-
      Teammates cloning this repo should get the 12.0.1xx daily .NET SDK (the .NET 12 alpha) into
      ./.dotnet together with the ios and android workloads by running one script, on macOS/Linux
      and on Windows. Write the scripts and whatever else the repo needs for that. Do not download or
      install anything now.
    tags:
      capability: daily-team-install-scripts
      risk: stale-manifests-on-teammates
      journey: team-setup
    golden_patch:
      path: ./references/daily-team-scripts.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "setup-local-sdk-daily-team-scripts"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Two scripts for teammates, install-dotnet.sh and install-dotnet.ps1, both pinned to the 12.0.1xx channel with the daily quality, installing into ./.dotnet and defaulting the workload list to ios and android (pass other ids as arguments). A daily band has no manifests on nuget.org and no workload set, so a plain workload install would keep the SDK's months-old bundled manifests: the scripts switch the installer to manifests update mode, refuse to install workloads unless NuGet.config lists the dotnet12 feed, and after the install read workload list and fail unless ios and android carry the SDK's own band (12.0.100-alpha.1) rather than a bundled older one such as 11.0.100-rc.1. NuGet.config, next to the scripts, lists nuget.org, the dotnet12 feed on pkgs.dev.azure.com/dnceng/public and the darc-pub-dotnet-android-* and darc-pub-dotnet-macios-* feeds read from dotnet/maui's NuGet.config on its net11.0 and release/11.0.1xx-rc2 branches, because the alpha's iOS and Android workloads still carry packs of the previous major; a repo that already has a NuGet.config should get these sources added to it instead, keeping its other sources and mappings. Nothing was downloaded now: the scripts only fetch the SDK when a teammate runs them.
    graders:
      - type: file-exists
        config:
          path: install*.sh
      - type: file-exists
        config:
          path: install*.ps1
      - type: file-contains
        config:
          path: install*.sh
          value: 12.0.1xx
      - type: file-contains
        config:
          path: install*.ps1
          value: 12.0.1xx
      - type: file-contains
        config:
          path: install*.sh
          value: daily
      - type: file-contains
        config:
          path: install*.ps1
          value: daily
      - type: file-contains
        config:
          path: install*.sh
          value: .dotnet
      - type: file-contains
        config:
          path: install*.ps1
          value: .dotnet
      - type: file-contains
        config:
          path: install*.sh
          value: ios
      - type: file-contains
        config:
          path: install*.ps1
          value: ios
      - type: file-contains
        config:
          path: install*.sh
          value: android
      - type: file-contains
        config:
          path: install*.ps1
          value: android
      - type: file-contains
        config:
          path: install*.sh
          value: _packaging/dotnet
      - type: file-contains
        config:
          path: install*.ps1
          value: _packaging/dotnet
      - type: file-contains
        config:
          path: install*.sh
          value: update-mode manifests
      - type: file-contains
        config:
          path: install*.ps1
          value: update-mode manifests
      - type: file-contains
        config:
          path: install*.sh
          value: NuGet.config
      - type: file-contains
        config:
          path: install*.ps1
          value: NuGet.config
      - type: file-contains
        config:
          path: install*.sh
          value: workload install
      - type: file-contains
        config:
          path: install*.ps1
          value: workload install
      - type: file-contains
        config:
          path: install*.sh
          value: workload list
      - type: file-contains
        config:
          path: install*.ps1
          value: workload list
      - type: file-contains
        config:
          path: install*.sh
          value: 'for w in "${WORKLOADS[@]}"'
      - type: file-contains
        config:
          path: install*.ps1
          value: 'foreach ($w in $Workloads)'
      - type: file-contains
        config:
          path: install*.sh
          value: 'build of the SDK''s lane'
      - type: file-contains
        config:
          path: install*.ps1
          value: 'build of the SDK''s lane'
      - type: file-exists
        config:
          path: NuGet.config
      - type: file-contains
        config:
          path: NuGet.config
          value: _packaging/dotnet12/
      - type: file-contains
        config:
          path: NuGet.config
          value: darc-pub-dotnet-android
      - type: file-contains
        config:
          path: NuGet.config
          value: darc-pub-dotnet-macios
      - type: output-matches
        config:
          pattern: '(dotnet12|pkgs\.dev\.azure\.com|darc-pub)'
      - type: output-not-matches
        config:
          pattern: '(dotnet-install: (Downloading|Extracting)|Installation finished successfully|Downloaded file size)'
      - type: prompt
    rubric:
      - The scripts install from the 12.0.1xx channel with the daily quality into ./.dotnet
      - The scripts switch the installer to manifests update mode and check that the daily feeds are configured before installing ios and android, instead of running a plain workload install
      - The scripts read workload list after the install and fail unless ios and android carry the band of the SDK
      - The agent wrote a NuGet.config with the dotnet12 feed and the darc-pub feeds of the iOS and Android workloads, taken from the previous major's dotnet/maui branches, or added them to an existing one
      - The agent did not download or install anything

  - name: Refuse a workload that no manifest of the band defines
    prompt: >-
      I have the 12.0.1xx daily SDK (12.0.100-alpha.1.26509.101) in ./.dotnet, the dotnet12 feed
      is in NuGet.config and the installer is in manifests update mode. ./.dotnet/dotnet workload
      install ios android maui installs ios and android from the 12.0.100-alpha.1 band, but maui
      comes out as 11.0.0-rc.1.25470.5/11.0.100-rc.1. How do I get the .NET 12 maui workload?
    tags:
      capability: refuse-workload-absent-from-band
      risk: wrong-band-reported-as-right
      journey: try-prerelease
    constraints:
      reject_tools:
        - bash
        - powershell
        - web_fetch
    graders:
      - type: output-matches
        config:
          pattern: '(no (maui )?manifest|not (yet )?(available|published|exist)|does not (yet )?(exist|ship|publish)|has not (yet )?(moved|shipped|published|been published)|cannot (get|come|be installed)|there is no)'
      - type: output-matches
        config:
          pattern: '(bundled|fell back|fallback|older band|previous band)'
      - type: output-matches
        config:
          pattern: '(without (the )?maui|without workloads|ios and android|skip(ping)? maui|omit maui|leave maui out|drop maui)'
      - type: prompt
    rubric:
      - The agent explained that no maui manifest exists for the 12.0.100-alpha.1 band, so the maui workload cannot come from that lane yet
      - The agent explained that the 11.0.100-rc.1 maui is the installer falling back to the manifests bundled with the SDK, not the .NET 12 workload
      - The agent told the user to install ios and android only, and that the SDK is usable without maui
      - The agent did not present a way to force the .NET 12 maui workload, such as rerunning the install with --skip-manifest-update or pointing at another band

  - name: "Non-activation: system-wide nightly runtime on a server"
    prompt: >-
      Our Ubuntu staging box needs the nightly .NET 11 ASP.NET Core runtime, no SDK, installed
      system-wide so the deployed app picks it up on the next restart. How do I install it?
    expect_activation: false
    tags:
      capability: dormancy-runtime-only-nightly
      risk: routing
      journey: boundary-condition
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "setup-local-sdk-runtime-only-dormancy"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              This is a system-wide, runtime-only install, so the project-local SDK setup (a .dotnet folder in a repo, global.json paths, team install scripts) does not apply here and I did not use it. On Ubuntu, install the runtime with the official script and the daily quality, into the system location: curl -fsSL https://dot.net/v1/dotnet-install.sh | sudo bash -s -- --runtime aspnetcore --channel 11.0 --quality daily --install-dir /usr/share/dotnet, then make sure /usr/share/dotnet/dotnet is on PATH (or symlinked to /usr/bin/dotnet) and restart the app so it picks up the new runtime. Daily runtimes are not in the Ubuntu package feeds, so the distro packages (apt) will not give you a nightly.
    graders:
      - type: output-matches
        config:
          pattern: '(--runtime\s+aspnetcore|aspnetcore|runtime-only|runtime only)'
      - type: output-not-matches
        config:
          pattern: '(--install-dir\s+\.dotnet|"paths"\s*:|sdk\.paths|install-dotnet\.(sh|ps1))'
      - type: prompt
    rubric:
      - Recognized this is a system-wide, runtime-only install, outside the scope of the project-local SDK setup
      - Did not apply the local SDK workflow, so no .dotnet folder in a repo, no global.json paths, no team install scripts
      - Pointed to a runtime-only route such as dotnet-install.sh with --runtime aspnetcore and the daily quality, installed system-wide
